apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jaeger-instance
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Bagwansufiyan/devops-eks-project.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fluent-bit
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://fluent.github.io/helm-charts
    chart: fluent-bit
    targetRevision: "0.48.9"
    helm:
      values: |
        env:
          - name: ES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: elasticsearch-master-credentials
                key: password
        config:
          outputs: |
            [OUTPUT]
                Name              es
                Match             kube.*
                Host              elasticsearch-master
                Port              9200
                HTTP_User         elastic
                HTTP_Passwd       ${ES_PASSWORD}
                tls               On
                tls.verify        Off
                Logstash_Format   On
                Logstash_Prefix   fluent-bit
                Suppress_Type_Name On
                Retry_Limit       False
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
